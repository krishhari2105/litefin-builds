name: Litefin-fork Build & Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from Litefin repository'
        required: true
        default: 'development'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Dynamic Metadata Tags
        id: prep
        run: |
          RAW_BRANCH="${{ github.event.inputs.branch }}"
          SANITIZED_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "date_tag=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "branch_tag=${SANITIZED_BRANCH}" >> $GITHUB_OUTPUT 

      - name: Checkout Litefin repository
        uses: actions/checkout@v4
        with:
          repository: 'krishhari2105/litefin'
          ref: ${{ github.event.inputs.branch }}     

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install and Build Project
        run: |
          npm install
          npm run build
          npm run package

      - name: Create or Update Litefin Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: "litefin-fork-build-${{ steps.prep.outputs.branch_tag }}-${{ steps.prep.outputs.date_tag }}"
          name: "Litefin-Fork Builds (${{ github.event.inputs.branch }}) - ${{ steps.prep.outputs.date_tag }}"
          body: "Manual build generated on ${{ steps.prep.outputs.date_tag }} from branch `${{ github.event.inputs.branch }}`."
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
             *.wgt
             *.ipk
